[workspace]
resolver = "2"
members = [
    "crates/winxime-tsf",
    "crates/winxime-ipc",
    "crates/winxime-server",
    "crates/winxime-setup",
    "crates/winxime-tsf-register",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Kor1 <kingzcheung@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ximeiorg/XimeYao"

[workspace.dependencies]
# libximecore — git dep，钉到包含 xime-speech ModelChecksum 与词典回调 Result 的合并提交；
# 本地开发时由 .cargo/config.toml 的 [patch] 覆盖为固定到同一提交的本地克隆。
librime = { git = "https://github.com/ximeiorg/libximecore.git", rev = "04d6ca9ee558f5f2b57df5f00ffb7aa77607ecee", package = "librime" }
librime-sys2 = { git = "https://github.com/ximeiorg/libximecore.git", rev = "04d6ca9ee558f5f2b57df5f00ffb7aa77607ecee", package = "librime-sys2" }
xime-config = { git = "https://github.com/ximeiorg/libximecore.git", rev = "04d6ca9ee558f5f2b57df5f00ffb7aa77607ecee", package = "xime-config" }
xime-rime = { git = "https://github.com/ximeiorg/libximecore.git", rev = "04d6ca9ee558f5f2b57df5f00ffb7aa77607ecee", package = "xime-rime" }
xime-ipc = { git = "https://github.com/ximeiorg/libximecore.git", rev = "04d6ca9ee558f5f2b57df5f00ffb7aa77607ecee", package = "xime-ipc" }
xime-setup-lib = { git = "https://github.com/ximeiorg/libximecore.git", rev = "04d6ca9ee558f5f2b57df5f00ffb7aa77607ecee", package = "xime-setup-lib" }
xime-plugin = { git = "https://github.com/ximeiorg/libximecore.git", rev = "04d6ca9ee558f5f2b57df5f00ffb7aa77607ecee", package = "xime-plugin" }
xime-speech = { git = "https://github.com/ximeiorg/libximecore.git", rev = "04d6ca9ee558f5f2b57df5f00ffb7aa77607ecee", package = "xime-speech" }

# libximep2p — 局域网直连传输层（剪贴板同步用），rev 与 xime-setup 的 pair-page 一致。
xime-p2p = { git = "https://github.com/ximeiorg/libximep2p.git", rev = "b19ecdec2c0336669897cafe909541906024dc29" }

# winxime workspace crates
winxime-tsf = { path = "crates/winxime-tsf" }
winxime-ipc = { path = "crates/winxime-ipc" }
winxime-tsf-register = { path = "crates/winxime-tsf-register" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_UI_TextServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

