[package]
name = "winxime-setup"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "GPL-3.0"
repository.workspace = true

[dependencies]
# clipboard-page/backup-page/voice-page：剪贴板同步（插件）、云备份与语音转文本设置页
# pair-page：设备关联（局域网 P2P 配对，依赖 libximep2p 的 xime-p2p）。
# 注意 pair-page 的匹配臂引用了 clipboard-page 门控的 SyncModeChanged，两个必须同开。
xime-setup-lib = { workspace = true, features = ["clipboard-page", "backup-page", "voice-page", "pair-page"] }
xime-config.workspace = true
winxime-ipc.workspace = true
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
tracing.workspace = true

[[bin]]
name = "winxime-setup"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
