name: 功能建议（Feature）
description: 提新功能或改进想法。请先搜一下已有 issue，避免重复。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先在 issue 里搜一下是否已有同类建议；重复的会被合并。

        建议请说清「想解决什么问题」，而不只是「想要什么功能」——这样我们才能判断值不值得做、怎么做。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在遇到什么不方便？什么场景下会需要它？
      placeholder: 经常要从剪贴板取上一条内容，但现在要手动打开剪贴板历史
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的使用方式
      description: 你希望怎么用它；如果有交互草图或界面想法更佳
      placeholder: 在候选栏上右键某个字词可以直接置顶
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 上屏 / 选字
        - 候选栏
        - 设置程序
        - 托盘图标 / 通知
        - 方案部署 / 方案市场
        - 词库 / 词典管理
        - 语音输入
        - 剪贴板同步
        - 安装 / 卸载 / 升级
        - 其它
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 可选。除了这个功能，你目前怎么绕过去的？
      placeholder: 现在只能手动打开剪贴板历史再复制
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可选。截图、相关链接、参考其它输入法的地方
    validations:
      required: false
